<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>AE Uniform</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"/>
<style>
/* Layout: sticky utility bar over a single centered work column; cards group each article. */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --surface-2:#f7f8fa; --line:#e1e5ec;
  --fg:#141922; --muted:#606a79; --brand:#1b3552; --accent:#1f56d3;
  --accent-soft:#e8efff; --ok:#0f7a56; --ok-soft:#e6f6ef;
  --warn:#b45309; --warn-soft:#fdf3e3; --violet:#6d3ecb; --violet-soft:#f0eaff;
  --danger:#b42318; --danger-soft:#fdeceb;
  --font-display:'Archivo',system-ui,-apple-system,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1319; --surface:#181d25; --surface-2:#1f252f; --line:#2b323d;
  --fg:#e9edf4; --muted:#96a1b2; --brand:#c6d8f0; --accent:#6f9dff;
  --accent-soft:#1b2740; --ok:#4ed3a1; --ok-soft:#12291f;
  --warn:#f0b35c; --warn-soft:#2d2314; --violet:#b294ff; --violet-soft:#241c3b;
  --danger:#ff8f85; --danger-soft:#33191a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#181d25; --surface-2:#1f252f; --line:#2b323d;
  --fg:#e9edf4; --muted:#96a1b2; --brand:#c6d8f0; --accent:#6f9dff;
  --accent-soft:#1b2740; --ok:#4ed3a1; --ok-soft:#12291f;
  --warn:#f0b35c; --warn-soft:#2d2314; --violet:#b294ff; --violet-soft:#241c3b;
  --danger:#ff8f85; --danger-soft:#33191a;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,.display{font-family:var(--font-display);text-wrap:balance}
input,select,textarea{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r-sm);outline:none;background:var(--surface);color:var(--fg);width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
button{font-family:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1020px;margin:0 auto;padding-inline:16px;padding-block:16px}
.bar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.bar-in{max-width:1020px;margin:0 auto;padding-inline:16px;padding-block:9px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.lbl{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
.btn{padding:7px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn[disabled]{opacity:.55;cursor:default}
.btn-primary{background:var(--brand);color:var(--surface);border-color:var(--brand)}
:root[data-theme="dark"] .btn-primary,
:root:not([data-theme="light"]) .btn-primary{color:#0f1319}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn-primary{color:#fff}}
.btn-accent{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.btn-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:600}
.grid{display:grid;gap:10px}
.row-wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.num{font-variant-numeric:tabular-nums}
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);min-width:0}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{background:var(--brand);color:#fff;font-weight:500;font-size:11px;letter-spacing:.03em;padding:8px;white-space:nowrap}
:root[data-theme="dark"] thead th{color:#0f1319}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) thead th{color:#0f1319}}
tbody td{padding:8px;border-top:1px solid var(--line)}
tbody tr:nth-child(even){background:var(--surface-2)}
.tab{padding:6px 13px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;font-size:12.5px;color:var(--muted);position:relative}
.tab[aria-selected="true"]{background:var(--surface-2);border-color:var(--line);color:var(--fg);font-weight:600}
.pill{font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px;letter-spacing:.03em}
.drop{border:1px dashed var(--line);border-radius:var(--r-sm);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}
.thumb{width:100%;height:86px;object-fit:contain;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);display:block}
.x{position:absolute;top:4px;right:4px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:12px;color:var(--muted);line-height:18px}
.note{border-radius:var(--r-sm);padding:9px 12px;font-size:12px}
@media print{.no-print{display:none!important}body{background:#fff}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const {useState,useRef,useEffect}=React;

/* ══════════ CONFIGURACIÓN ══════════ */
const BRAND='AE UNIFORM';
const BIZ_EMAIL='aeuniform25@gmail.com';
const BIZ_PHONE='787-249-0678';
const ADMIN_PIN='AE2026';
const SHEET_URL='https://script.google.com/macros/s/AKfycbwawEWmygkex_KXOSu_OMRfcoTGuQU8vgrS7NKszXJ3SIzbT4BAFzZ4CBN74XR6OLCEhg/exec';

/* ══════════ CATÁLOGOS ══════════ */
const SIZES=['XS','S','M','L','XL','XXL'];
const CATALOG=['Polo','T-Shirt / Camisa','Gorra','Jersey Femenino','Jersey Masculino','Hoodie','Pantalón Reversible','Falda','Leggings','Lycra','Medias','Sleeves','Otro'];
const DEF={'Polo':20,'T-Shirt / Camisa':14,'Gorra':15,'Jersey Femenino':14,'Jersey Masculino':14,'Hoodie':18,'Pantalón Reversible':27,'Falda':15,'Leggings':18,'Lycra':15,'Medias':8,'Sleeves':6,'Otro':0};
const FABRICS=['Dri-Fit','Sublimación','Algodón','Poliéster','Spandex','Mesh/Malla','French Terry','Lycra','Nylon','Otro'];
const SPORTS=['Basketball','Fútbol','Volleyball','Baseball','Softball','Tenis','Track & Field','Natación','Ciclismo','Otro'];
const COLLARS=['Redondo','Cuello V','Polo/Botones','Cuello alto','Otro'];
const AUDIENCES=['Hombre','Mujer','Niños','Unisex'];
const STATUSES=[
  {key:'enviada',  label:'Enviada a cliente', c:'var(--accent)', bg:'var(--accent-soft)'},
  {key:'aceptada', label:'Aceptada',          c:'var(--violet)', bg:'var(--violet-soft)'},
  {key:'deposito', label:'Depósito cobrado',  c:'var(--warn)',   bg:'var(--warn-soft)'},
  {key:'entregado',label:'Entregado',         c:'var(--ok)',     bg:'var(--ok-soft)'},
  {key:'saldo',    label:'Saldo cobrado',     c:'var(--fg)',     bg:'var(--surface-2)'},
];
const stat=k=>STATUSES.find(s=>s.key===k)||STATUSES[0];
const OSTATUSES=[
  {key:'pendiente', label:'Pendiente',   c:'var(--muted)',  bg:'var(--surface-2)'},
  {key:'fabrica',   label:'En fábrica',  c:'var(--warn)',   bg:'var(--warn-soft)'},
  {key:'transito',  label:'En tránsito', c:'var(--violet)', bg:'var(--violet-soft)'},
  {key:'recibida',  label:'Recibida',    c:'var(--accent)', bg:'var(--accent-soft)'},
  {key:'entregada', label:'Entregada',   c:'var(--ok)',     bg:'var(--ok-soft)'},
];
const ostat=k=>OSTATUSES.find(s=>s.key===k)||OSTATUSES[0];

/* ══════════ UTILIDADES ══════════ */
let _n=0; const uid=()=>++_n;
const qid=()=>'Q'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().split('T')[0];
const fmt=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const rf=(f,cb)=>{const r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(f);};
/* Reduce la foto antes de enviarla: un celular manda 8MB y el backend se cae. */
const shrink=(file,cb)=>{
  rf(file,src=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1400;
      const s=Math.min(1,MAX/Math.max(img.width,img.height));
      if(s===1&&src.length<700000){cb(src);return;}
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      const ctx=c.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img,0,0,c.width,c.height);
      try{cb(c.toDataURL('image/jpeg',0.85));}catch(e){cb(src);}
    };
    img.onerror=()=>cb(src);
    img.src=src;
  });
};
const sumSizes=o=>SIZES.reduce((s,z)=>s+(Number((o||{})[z.toLowerCase()])||0),0);
const emptySizes=()=>({xs:0,s:0,m:0,l:0,xl:0,xxl:0});
const qtyOf=i=>{
  if(!i)return 0;
  if(i.sizes)return (i.audience||[]).reduce((s,a)=>s+sumSizes(i.sizes[a]),0);
  return sumSizes(i);
};
/* Un artículo con varias audiencias se convierte en una fila por audiencia. */
const flatItems=items=>(items||[]).reduce((out,it)=>{
  if(!it.sizes){out.push(it);return out;}
  const auds=(it.audience&&it.audience.length)?it.audience:['Sin especificar'];
  auds.forEach((a,ai)=>{
    const row=Object.assign({},it,it.sizes[a]||emptySizes(),{
      id:String(it.id)+'-'+a, audience:a,
      model:(it.models||{})[a]||'',
      roster:(it.roster||[]).filter(r=>r.aud===a),
      images:ai===0?(it.images||[]):[],
      notes:ai===0?(it.notes||''):''
    });
    delete row.sizes; delete row.models;
    out.push(row);
  });
  return out;
},[]);
const grandOf=items=>items.reduce((s,i)=>s+qtyOf(i)*(Number(i.price)||0),0);
const dLong=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-PR',{year:'numeric',month:'long',day:'numeric'}):'—';
const dShort=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-PR',{month:'short',day:'numeric',year:'numeric'}):'—';
const audText=it=>Array.isArray(it.audience)?(it.audience.join(', ')||'—'):(it.audience||'—');
const nextNum=()=>'Se asigna al enviar';

/* ══════════ BACKEND ══════════ */
const post=async p=>{
  const r=await fetch(SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
  return await r.json();
};
const getList=async()=>{const r=await fetch(SHEET_URL+'?action=list');return await r.json();};

/* respaldo en este navegador */
const LS='ae_quotes_v1';
const lsLoad=()=>{try{return JSON.parse(localStorage.getItem(LS)||'[]');}catch(e){return[];}};
const lsSave=d=>{try{localStorage.setItem(LS,JSON.stringify(d));}catch(e){}};

/* ══════════ MODELOS ══════════ */
const newItem=()=>({id:uid(),name:'Polo',price:20,sizes:{Hombre:emptySizes()},fabric:'Dri-Fit',material:'',color:'',audience:['Hombre'],collar:'',reversible:false,isSport:false,sport:'Basketball',notes:'',roster:[],images:[]});
const newOI=()=>({id:uid(),garment:'Polo',color:'',fabric:'Dri-Fit',xs:0,s:0,m:0,l:0,xl:0,xxl:0,productImg:null,logo:null,placement:'Frente pecho izquierdo',placementSize:'5 cm',notes:'',roster:[]});
const newOrd=()=>{const n=Date.now()%10000;return{id:qid(),orderNum:'ORD-'+new Date().getFullYear()+'-'+String(n).slice(-4),client:'',quoteNum:'',date:today(),deliveryDate:'',status:'pendiente',items:[newOI()],notes:''};};

/* Convierte una cotización aceptada en ficha de producción. */
const orderFromQuote=q=>({
  id:qid(),
  orderNum:'ORD-'+new Date().getFullYear()+'-'+String(q.quoteNum||'').replace(/\D/g,'').slice(-3),
  client:q.client||'', quoteNum:q.quoteNum||'',
  date:today(), deliveryDate:q.deliveryDate||'', status:'pendiente',
  notes:[q.needBy?'Para cuándo: '+q.needBy:'',q.notes||''].filter(Boolean).join('\n'),
  items:flatItems(q.items).map(it=>Object.assign({},emptySizes(),{
    id:uid(),
    garment:it.name+(it.audience?' — '+it.audience:'')+(it.model?' ('+it.model+')':''),
    color:it.color||'', fabric:it.fabric||'',
    xs:it.xs||0,s:it.s||0,m:it.m||0,l:it.l||0,xl:it.xl||0,xxl:it.xxl||0,
    productImg:null, logo:null,
    placement:'Frente pecho izquierdo', placementSize:'5 cm',
    notes:[it.notes||'',it.collar?'Cuello: '+it.collar:'',it.material||''].filter(Boolean).join(' · '),
    roster:it.roster||[]
  }))
});

/* ══════════ PIEZAS DE UI ══════════ */
const Card=({children,style})=><div className="card" style={style}>{children}</div>;
const Field=({label,children})=><div style={{minWidth:0}}><div className="lbl">{label}</div>{children}</div>;
const Btn=({children,cls='',...p})=><button className={'btn '+cls} {...p}>{children}</button>;

function Mark({h=32}){
  const [bad,setBad]=useState(false);
  if(bad)return <div className="display" style={{width:h,height:h,background:'var(--brand)',color:'var(--surface)',borderRadius:8,display:'grid',placeItems:'center',fontWeight:700,fontSize:h*.38,letterSpacing:'.02em',flexShrink:0}}>AE</div>;
  return <img src="logo.png" alt={BRAND} onError={()=>setBad(true)} style={{height:h,width:'auto',objectFit:'contain',display:'block',flexShrink:0}}/>;
}

function ImgOne({value,onChange,label}){
  const ref=useRef();
  return <div>
    <div className="lbl">{label}</div>
    {value
      ?<div style={{position:'relative'}}>
        <img src={value} alt={label} style={{width:'100%',height:98,objectFit:'contain',borderRadius:7,border:'1px solid var(--line)',background:'var(--surface-2)',display:'block'}}/>
        <button className="x" onClick={()=>onChange(null)} aria-label="Quitar imagen">×</button>
      </div>
      :<div className="drop" style={{height:98,flexDirection:'column',gap:4,cursor:'pointer'}} onClick={()=>ref.current&&ref.current.click()}>
        <span style={{fontSize:19,lineHeight:1}}>+</span><span>Subir imagen</span>
      </div>}
    <input ref={ref} type="file" accept="image/*" hidden onChange={e=>{const f=e.target.files[0];if(f)shrink(f,onChange);e.target.value='';}}/>
  </div>;
}

function ImgMany({images,onChange}){
  const ref=useRef();
  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:6}}>
      <div className="lbl" style={{margin:0}}>Diseños y logos{images.length?' · '+images.length:''}</div>
      <Btn cls="btn-accent" style={{padding:'4px 10px',fontSize:12}} onClick={()=>ref.current&&ref.current.click()}>+ Agregar imagen</Btn>
    </div>
    <input ref={ref} type="file" accept="image/*" multiple hidden
      onChange={e=>{const fs=Array.from(e.target.files);let acc=images.slice();
        fs.forEach(f=>shrink(f,src=>{acc=acc.concat([{id:uid(),src,label:''}]);onChange(acc);}));e.target.value='';}}/>
    {images.length===0
      ?<div className="drop" style={{padding:16,cursor:'pointer'}} onClick={()=>ref.current&&ref.current.click()}>
        Sube tu arte, logos o fotos de referencia. Puedes escoger varios a la vez.
      </div>
      :<div className="grid" style={{gridTemplateColumns:'repeat(auto-fill,minmax(118px,1fr))'}}>
        {images.map(im=><div key={im.id}>
          <div style={{position:'relative'}}>
            <img className="thumb" src={im.src} alt={im.label||'referencia'}/>
            <button className="x" onClick={()=>onChange(images.filter(x=>x.id!==im.id))} aria-label="Quitar">×</button>
          </div>
          <input value={im.label} placeholder="Ej: logo frente"
            onChange={e=>onChange(images.map(x=>x.id===im.id?Object.assign({},x,{label:e.target.value}):x))}
            style={{marginTop:4,fontSize:11,padding:'4px 6px'}}/>
        </div>)}
      </div>}
  </div>;
}

function SizeRow({vals,onSet,total,idKey}){
  return <div className="row-wrap">
    {SIZES.map(z=><div key={z} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
      <label htmlFor={'sz'+idKey+z} style={{fontSize:11,fontWeight:600,color:'var(--muted)'}}>{z}</label>
      <input id={'sz'+idKey+z} className="num" type="number" min="0" value={(vals||{})[z.toLowerCase()]||0}
        onChange={e=>onSet(z.toLowerCase(),e.target.value)} style={{width:54,textAlign:'center'}}/>
    </div>)}
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
      <span style={{fontSize:11,fontWeight:600,color:'var(--muted)'}}>TOTAL</span>
      <span className="num display" style={{width:54,height:35,display:'grid',placeItems:'center',fontWeight:700,fontSize:16,color:'var(--accent)'}}>{sumSizes(vals)}</span>
    </div>
    {typeof total==='number'&&<span className="num" style={{fontSize:14,fontWeight:600,color:'var(--accent)',paddingBottom:8}}>{fmt(total)}</span>}
  </div>;
}

/* Lista de nombres y números para uniformes deportivos. */
function Roster({item,onChange}){
  const rows=item.roster||[];
  const auds=item.audience||[];
  const set=(id,f,v)=>onChange(rows.map(r=>r.id===id?Object.assign({},r,{[f]:v}):r));
  const add=()=>onChange(rows.concat([{id:uid(),num:'',name:'',size:'m',aud:auds[0]||'Unisex'}]));
  const pcs=qtyOf(item);
  return <div style={{borderTop:'1px solid var(--line)',paddingTop:13}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:6,flexWrap:'wrap'}}>
      <div className="lbl" style={{margin:0}}>
        Nombres y números {rows.length>0&&<span style={{color:pcs&&rows.length!==pcs?'var(--warn)':'var(--muted)'}}>
          · {rows.length} de {pcs} piezas</span>}
      </div>
      <Btn cls="btn-accent" style={{padding:'4px 10px',fontSize:12}} onClick={add}>+ Añadir jugador</Btn>
    </div>
    {rows.length===0
      ?<div className="drop" style={{padding:12,fontSize:12,cursor:'pointer'}} onClick={add}>
        Opcional. Úsalo si cada pieza lleva un nombre o número distinto.</div>
      :<div className="grid" style={{gap:6}}>
        {rows.map((r,i)=><div key={r.id} style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          <span className="num" style={{fontSize:11,color:'var(--muted)',width:20,textAlign:'right'}}>{i+1}</span>
          <input className="num" value={r.num} onChange={e=>set(r.id,'num',e.target.value)}
            placeholder="#" style={{width:56,textAlign:'center'}} aria-label="Número"/>
          <input value={r.name} onChange={e=>set(r.id,'name',e.target.value)}
            placeholder="Nombre" style={{flex:'1 1 130px',minWidth:0}} aria-label="Nombre"/>
          <select value={r.size} onChange={e=>set(r.id,'size',e.target.value)} style={{width:78}} aria-label="Talla">
            {SIZES.map(z=><option key={z} value={z.toLowerCase()}>{z}</option>)}
          </select>
          {auds.length>1&&<select value={r.aud} onChange={e=>set(r.id,'aud',e.target.value)} style={{width:100}} aria-label="Corte">
            {auds.map(a=><option key={a}>{a}</option>)}
          </select>}
          <button onClick={()=>onChange(rows.filter(x=>x.id!==r.id))}
            style={{background:'none',border:'none',color:'var(--muted)',fontSize:16,padding:'0 4px'}} aria-label="Quitar">×</button>
        </div>)}
        {pcs>0&&rows.length!==pcs&&<p style={{fontSize:11,color:'var(--warn)',marginTop:2}}>
          La lista no cuadra con las cantidades por talla. Revísala antes de enviar.</p>}
      </div>}
  </div>;
}

/* ══════════ EXPORT WORD ══════════ */
function dl(html,name){
  const url=URL.createObjectURL(new Blob([html],{type:'application/msword'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function quoteDoc(q,prices){
  const items=flatItems(q.items);
  const rows=items.map((it,i)=>'<tr style="background:'+(i%2?'#f7f8fa':'#fff')+'">'+
    '<td style="padding:7px 10px;border:1px solid #e1e5ec;font-weight:600">'+it.name+
    (it.model?'<div style="font-weight:400;font-size:9pt;color:#606a79">'+it.model+'</div>':'')+'</td>'+
    '<td style="padding:7px 6px;border:1px solid #e1e5ec;text-align:center">'+(it.fabric||'—')+'</td>'+
    '<td style="padding:7px 6px;border:1px solid #e1e5ec;text-align:center">'+audText(it)+'</td>'+
    '<td style="padding:7px 6px;border:1px solid #e1e5ec;text-align:center">'+(it.collar||'—')+'</td>'+
    SIZES.map(z=>'<td style="padding:7px 5px;border:1px solid #e1e5ec;text-align:center">'+(Number(it[z.toLowerCase()])||'—')+'</td>').join('')+
    '<td style="padding:7px 8px;border:1px solid #e1e5ec;text-align:center;font-weight:600">'+qtyOf(it)+'</td>'+
    (prices?'<td style="padding:7px 8px;border:1px solid #e1e5ec;text-align:center">'+fmt(it.price)+'</td>'+
    '<td style="padding:7px 10px;border:1px solid #e1e5ec;text-align:right;font-weight:700;color:#1f56d3">'+fmt(qtyOf(it)*(Number(it.price)||0))+'</td>':'')+
    '</tr>').join('');
  const notes=items.filter(it=>it.notes).map(it=>
    '<div style="margin-bottom:5px;font-size:10pt"><b>'+it.name+':</b> '+it.notes+'</div>').join('');
  const rosters=items.filter(it=>(it.roster||[]).length>0).map(it=>
    '<div style="margin-bottom:12px"><div style="font-size:10pt;font-weight:bold;margin-bottom:4px">'+
    it.name+' · '+it.audience+' — '+it.roster.length+' jugadores</div>'+
    '<table style="border-collapse:collapse;width:auto;font-size:10pt"><thead><tr>'+
    '<th style="background:#1b3552;color:#fff;padding:5px 9px">#</th>'+
    '<th style="background:#1b3552;color:#fff;padding:5px 9px;text-align:left">Nombre</th>'+
    '<th style="background:#1b3552;color:#fff;padding:5px 9px">Talla</th></tr></thead><tbody>'+
    it.roster.map((r,i)=>'<tr style="background:'+(i%2?'#f7f8fa':'#fff')+'">'+
      '<td style="padding:4px 9px;border:1px solid #e1e5ec;text-align:center">'+(r.num||'')+'</td>'+
      '<td style="padding:4px 9px;border:1px solid #e1e5ec">'+(r.name||'')+'</td>'+
      '<td style="padding:4px 9px;border:1px solid #e1e5ec;text-align:center">'+String(r.size||'').toUpperCase()+'</td></tr>').join('')+
    '</tbody></table></div>').join('');
  const imgs=items.reduce((a,it)=>a.concat((it.images||[]).map(im=>
    '<div style="display:inline-block;margin:5px;text-align:center;vertical-align:top">'+
    '<img src="'+im.src+'" style="height:96px;border:1px solid #e1e5ec;border-radius:6px;display:block"/>'+
    '<div style="font-size:9pt;color:#606a79;margin-top:3px">'+(im.label||it.name)+'</div></div>')),[]).join('');
  const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
  '<head><meta charset="utf-8"/><title>Cotizacion '+q.quoteNum+'</title>'+
  '<style>body{font-family:Arial,Helvetica,sans-serif;font-size:11pt;color:#141922}table{border-collapse:collapse;width:100%}th{background:#1b3552;color:#fff;padding:7px 8px;font-size:10pt}</style></head><body>'+
  '<table style="margin-bottom:18px"><tr>'+
  '<td><div style="font-size:19pt;font-weight:bold;letter-spacing:2px">'+BRAND+'</div>'+
  '<div style="font-size:9pt;color:#606a79">'+BIZ_PHONE+' · '+BIZ_EMAIL+'</div></td>'+
  '<td style="text-align:right;vertical-align:top"><div style="font-size:16pt;font-weight:bold;color:#1f56d3">'+q.quoteNum+'</div>'+
  '<div style="font-size:10pt;color:#606a79">'+dLong(q.date)+'</div></td></tr></table>'+
  '<table style="width:auto;margin-bottom:16px">'+
  '<tr><td style="font-size:9pt;color:#606a79;padding-right:22px">Preparado para</td><td style="font-size:13pt;font-weight:bold">'+(q.client||'—')+'</td></tr>'+
  '<tr><td style="font-size:9pt;color:#606a79;padding-right:22px">Contacto</td><td style="font-size:10pt">'+(q.email||'—')+(q.phone?' · '+q.phone:'')+'</td></tr>'+
  '<tr><td style="font-size:9pt;color:#606a79;padding-right:22px">Fecha de entrega</td><td style="font-size:11pt">'+dLong(q.deliveryDate)+
  (q.needBy?' — '+q.needBy:'')+'</td></tr></table>'+
  '<table style="margin-bottom:16px"><thead><tr><th style="text-align:left;padding-left:10px">Artículo</th><th>Tela</th><th>Audiencia</th><th>Cuello</th>'+
  SIZES.map(z=>'<th>'+z+'</th>').join('')+'<th>Cant.</th>'+
  (prices?'<th>P.U.</th><th style="text-align:right;padding-right:10px">Total</th>':'')+
  '</tr></thead><tbody>'+rows+'</tbody></table>'+
  (notes?'<div style="margin-bottom:16px"><div style="font-size:9pt;font-weight:bold;color:#606a79;letter-spacing:1px;margin-bottom:6px">DETALLES DE CADA PIEZA</div>'+notes+'</div>':'')+
  (rosters?'<div style="margin-bottom:16px"><div style="font-size:9pt;font-weight:bold;color:#606a79;letter-spacing:1px;margin-bottom:6px">NOMBRES Y NÚMEROS</div>'+rosters+'</div>':'')+
  (q.notes?'<div style="margin-bottom:16px"><div style="font-size:9pt;font-weight:bold;color:#606a79;letter-spacing:1px;margin-bottom:6px">COMENTARIOS GENERALES</div>'+
  '<div style="font-size:10pt">'+q.notes+'</div></div>':'')+
  '<table style="width:270px;margin-left:auto;margin-bottom:20px">'+
  '<tr><td style="padding:5px 10px;color:#606a79;font-size:10pt">Total de piezas</td><td style="text-align:right;font-weight:600">'+q.items.reduce((s,i)=>s+qtyOf(i),0)+'</td></tr>'+
  (prices?'<tr><td style="padding:9px 10px;font-size:12pt;font-weight:bold;border-top:1px solid #e1e5ec">Total general</td>'+
  '<td style="text-align:right;font-size:14pt;font-weight:bold;color:#1f56d3;border-top:1px solid #e1e5ec">'+fmt(grandOf(q.items))+'</td></tr>':'')+
  '</table>'+
  (imgs?'<div style="margin-bottom:16px"><div style="font-size:9pt;font-weight:bold;color:#606a79;letter-spacing:1px;margin-bottom:6px">DISEÑOS Y LOGOS</div>'+imgs+'</div>':'')+
  '<div style="background:#f7f8fa;padding:10px 12px;border-radius:6px;font-size:9pt;color:#606a79">'+
  (prices?'<b>Condiciones:</b> Precios por unidad · Cotización válida 30 días · No incluye IVU'
         :'<b>Nota:</b> Esta es una solicitud de cotización, no una factura. Los costos finales se envían por separado.')+
  '</div></body></html>';
  dl(html,'Cotizacion_'+q.quoteNum+'.doc');
}
function orderDoc(o){
  const body=o.items.map((it,i)=>'<div style="margin-bottom:22px;padding-bottom:22px;'+(i<o.items.length-1?'border-bottom:1px solid #e1e5ec':'')+'">'+
    '<table style="width:100%;margin-bottom:8px"><tr><td style="font-size:13pt;font-weight:bold">'+it.garment+(it.color?' — '+it.color:'')+'</td>'+
    '<td style="text-align:right;font-size:10pt;color:#606a79">Tela: '+(it.fabric||'—')+'</td></tr></table>'+
    '<table style="border-collapse:collapse;width:100%;margin-bottom:8px"><thead><tr>'+
    SIZES.map(z=>'<th style="background:#1b3552;color:#fff;padding:6px 8px">'+z+'</th>').join('')+
    '<th style="background:#1b3552;color:#fff;padding:6px 8px">Total</th></tr></thead><tbody><tr style="text-align:center">'+
    SIZES.map(z=>'<td style="padding:6px 8px;border:1px solid #e1e5ec">'+(Number(it[z.toLowerCase()])||'—')+'</td>').join('')+
    '<td style="padding:6px 8px;border:1px solid #e1e5ec;font-weight:bold;color:#1f56d3">'+qtyOf(it)+'</td></tr></tbody></table>'+
    '<div style="font-size:10pt;color:#606a79">Ubicación: '+(it.placement||'—')+(it.placementSize?' · '+it.placementSize:'')+'</div>'+
    (it.notes?'<div style="padding:8px;background:#f7f8fa;border-radius:5px;font-size:10pt;margin-top:6px">'+it.notes+'</div>':'')+'</div>').join('');
  dl('<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
  '<head><meta charset="utf-8"/><title>Ficha '+o.orderNum+'</title><style>body{font-family:Arial,Helvetica,sans-serif;font-size:11pt}</style></head><body>'+
  '<table style="width:100%;margin-bottom:18px"><tr><td><span style="font-size:19pt;font-weight:bold;letter-spacing:2px">'+BRAND+'</span></td>'+
  '<td style="text-align:right"><div style="font-size:15pt;font-weight:bold">'+o.orderNum+'</div><div>'+(o.client||'—')+'</div>'+
  '<div style="font-size:9pt;color:#606a79">'+dLong(o.date)+'</div></td></tr></table><hr style="border:0;border-top:1px solid #e1e5ec;margin-bottom:18px"/>'+
  body+'<div style="margin-top:18px;padding-top:10px;border-top:1px solid #e1e5ec;font-size:9pt;color:#606a79">'+BRAND+' · '+BIZ_PHONE+
  ' · Total de piezas: <b>'+o.items.reduce((s,i)=>s+qtyOf(i),0)+'</b></div></body></html>','Orden_'+o.orderNum+'.doc');
}

/* ══════════ FORMULARIO ══════════ */
function QuoteForm({q,setQ,setItem,addItem,delItem,onPreview,onExport,admin}){
  const set=(f,v)=>setQ(p=>Object.assign({},p,{[f]:v}));
  return <div className="grid" style={{gap:11}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',gap:12,flexWrap:'wrap'}}>
      <div>
        <h1 className="display" style={{fontSize:21,fontWeight:700,letterSpacing:'-.01em'}}>Nueva cotización</h1>
        <p style={{fontSize:12.5,color:'var(--muted)',marginTop:2}}>
          {admin?'Precios editables por cliente.':'Escoge tus prendas, tallas y diseño. Te responderemos con la confirmación final.'}
        </p>
      </div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        {admin&&<Btn cls="btn-ok" onClick={onExport}>Exportar Word</Btn>}
        <Btn cls="btn-accent" onClick={onPreview}>Ver cotización →</Btn>
      </div>
    </div>

    <Card>
      <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))'}}>
        <Field label="Cliente u organización *"><input id="f-client" value={q.client} onChange={e=>set('client',e.target.value)} placeholder="Escuela, liga o empresa"/></Field>
        <Field label="Correo electrónico *"><input id="f-email" type="email" value={q.email} onChange={e=>set('email',e.target.value)} placeholder="tucorreo@ejemplo.com"/></Field>
        <Field label="Teléfono"><input id="f-phone" value={q.phone} onChange={e=>set('phone',e.target.value)} placeholder="787-000-0000"/></Field>
        <Field label="Fecha"><input id="f-date" type="date" value={q.date} onChange={e=>set('date',e.target.value)}/></Field>
        <Field label="Fecha límite"><input id="f-dd" type="date" value={q.deliveryDate} onChange={e=>set('deliveryDate',e.target.value)}/></Field>
      </div>
      <div style={{marginTop:10}}>
        <label className="lbl" htmlFor="f-when">¿Para cuándo necesitas la orden?</label>
        <input id="f-when" value={q.needBy||''} onChange={e=>set('needBy',e.target.value)}
          placeholder="Ej: para el torneo del 15 de noviembre, antes del inicio de clases, no hay prisa"/>
      </div>
    </Card>

    {q.items.map((item,idx)=>{
      const si=(f,v)=>setItem(item.id,f,v);
      return <Card key={item.id}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <span className="display" style={{fontWeight:600,fontSize:13,letterSpacing:'.05em',textTransform:'uppercase',color:'var(--muted)'}}>Artículo {idx+1}</span>
          {q.items.length>1&&<button onClick={()=>delItem(item.id)} style={{fontSize:11.5,background:'none',border:'none',color:'var(--muted)',textDecoration:'underline'}}>Eliminar</button>}
        </div>

        <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',marginBottom:11}}>
          <Field label="Artículo">
            <select value={item.name} onChange={e=>{si('name',e.target.value);setItem(item.id,'price',DEF[e.target.value]||0);}}>
              {CATALOG.map(c=><option key={c}>{c}</option>)}
            </select>
          </Field>
          {admin&&<Field label="Precio unidad">
            <input className="num" type="number" value={item.price} onChange={e=>si('price',e.target.value)} style={{textAlign:'center'}}/>
          </Field>}
          <Field label="Tela"><select value={item.fabric} onChange={e=>si('fabric',e.target.value)}>{FABRICS.map(f=><option key={f}>{f}</option>)}</select></Field>
          <Field label="Colores"><input value={item.color||''} onChange={e=>si('color',e.target.value)} placeholder="Ej: azul marino y blanco"/></Field>
          <Field label="Material o detalle"><input value={item.material} onChange={e=>si('material',e.target.value)} placeholder="Ej: 100% poliéster"/></Field>
        </div>

        <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(190px,1fr))',marginBottom:13}}>
          <Field label="Tipo de cuello">
            <select value={item.collar} onChange={e=>si('collar',e.target.value)}>
              <option value="">No aplica</option>
              {COLLARS.map(c=><option key={c}>{c}</option>)}
            </select>
          </Field>
          <div style={{minWidth:0}}>
            <div className="lbl">Opciones</div>
            <div style={{display:'flex',gap:16,alignItems:'center',flexWrap:'wrap',paddingTop:4}}>
              <label style={{display:'flex',alignItems:'center',gap:6,fontSize:13}}>
                <input type="checkbox" checked={item.reversible} onChange={e=>si('reversible',e.target.checked)}/> Reversible</label>
              <label style={{display:'flex',alignItems:'center',gap:6,fontSize:13}}>
                <input type="checkbox" checked={item.isSport} onChange={e=>si('isSport',e.target.checked)}/> Deportivo</label>
              {item.isSport&&<select value={item.sport} onChange={e=>si('sport',e.target.value)} style={{width:'auto',minWidth:130}}>
                {SPORTS.map(s=><option key={s}>{s}</option>)}</select>}
            </div>
          </div>
        </div>

        <div style={{marginBottom:14}}>
          <div className="lbl">Corte y cantidades · marca los que necesites</div>
          <div style={{display:'flex',gap:14,flexWrap:'wrap',marginBottom:10}}>
            {AUDIENCES.map(a=>{
              const on=(item.audience||[]).indexOf(a)>=0;
              return <label key={a} style={{display:'flex',alignItems:'center',gap:6,fontSize:13}}>
                <input type="checkbox" checked={on} onChange={()=>{
                  if(on){si('audience',(item.audience||[]).filter(x=>x!==a));}
                  else{
                    si('audience',(item.audience||[]).concat([a]));
                    if(!(item.sizes||{})[a])setItem(item.id,'sizes',Object.assign({},item.sizes,{[a]:emptySizes()}));
                  }
                }}/>{a}</label>;
            })}
          </div>

          {(item.audience||[]).length===0
            ?<div className="drop" style={{padding:13,fontSize:12.5}}>Marca al menos un corte para poner las cantidades.</div>
            :<div className="grid" style={{gap:10}}>
              {(item.audience||[]).map(a=>{
                const vals=(item.sizes||{})[a]||emptySizes();
                return <div key={a} style={{background:'var(--surface-2)',borderRadius:'var(--r-sm)',padding:'10px 12px'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:7,flexWrap:'wrap'}}>
                    <span className="display" style={{fontSize:12,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--accent)'}}>{a}</span>
                    {admin&&sumSizes(vals)>0&&<span className="num" style={{fontSize:12.5,fontWeight:600,color:'var(--accent)'}}>{fmt(sumSizes(vals)*(Number(item.price)||0))}</span>}
                  </div>
                  <SizeRow idKey={String(item.id)+a} vals={vals} total={null}
                    onSet={(k,v)=>setItem(item.id,'sizes',Object.assign({},item.sizes,{[a]:Object.assign({},vals,{[k]:v})}))}/>
                  <input value={(item.models||{})[a]||''} placeholder={'Modelo o corte para '+a.toLowerCase()+' (ej: corte entallado, manga larga)'}
                    onChange={e=>setItem(item.id,'models',Object.assign({},item.models,{[a]:e.target.value}))}
                    style={{marginTop:8,fontSize:12}}/>
                </div>;
              })}
            </div>}
        </div>

        <div style={{marginBottom:14}}>
          <label className="lbl" htmlFor={'n'+item.id}>Describe esta pieza</label>
          <textarea id={'n'+item.id} rows="2" value={item.notes||''} onChange={e=>si('notes',e.target.value)}
            style={{resize:'vertical'}}
            placeholder="Colores, para qué equipo o evento es, números o nombres al dorso, detalles del diseño…"/>
        </div>

        <div style={{borderTop:'1px solid var(--line)',paddingTop:13}}>
          <ImgMany images={item.images||[]} onChange={v=>si('images',v)}/>
        </div>

        <Roster item={item} onChange={v=>si('roster',v)}/>
      </Card>;
    })}

    <button onClick={addItem} className="drop" style={{padding:11,fontSize:12.5,fontWeight:500,cursor:'pointer',width:'100%'}}>+ Agregar otro artículo</button>

    <Card>
      <label className="lbl" htmlFor="f-notes">Comentarios generales</label>
      <textarea id="f-notes" rows="3" value={q.notes||''} onChange={e=>set('notes',e.target.value)} style={{resize:'vertical'}}
        placeholder="¿Para qué es el pedido? Fecha del evento, equipo o escuela, colores de la institución, cualquier cosa que debamos saber."/>
    </Card>

    <div style={{display:'flex',justifyContent:'flex-end'}}>
      <Card style={{minWidth:215}}>
        {[['Artículos',q.items.length],['Piezas',q.items.reduce((s,i)=>s+qtyOf(i),0)]].map(r=>
          <div key={r[0]} style={{display:'flex',justifyContent:'space-between',gap:36,fontSize:12.5,color:'var(--muted)',marginBottom:6}}>
            <span>{r[0]}</span><span className="num" style={{fontWeight:600,color:'var(--fg)'}}>{r[1]}</span></div>)}
        {admin&&<div style={{borderTop:'1px solid var(--line)',paddingTop:9,display:'flex',justifyContent:'space-between',gap:36,alignItems:'baseline'}}>
          <span style={{fontWeight:600}}>Total</span>
          <span className="num display" style={{color:'var(--accent)',fontSize:19,fontWeight:700}}>{fmt(grandOf(q.items))}</span></div>}
      </Card>
    </div>
  </div>;
}

/* ══════════ PREVIEW ══════════ */
function QuoteView({q,onBack,onExport,onSubmit,state,readOnly,prices,onPrice,children}){
  const rows=flatItems(q.items);
  const imgs=q.items.reduce((a,i)=>a.concat((i.images||[]).map(im=>Object.assign({},im,{from:i.name}))),[]);
  const label=state==='sending'?'Enviando…':state==='sent'?'Cotización sometida':'Someter cotización';
  return <div className="grid" style={{gap:12}}>
    <div className="no-print" style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
      <Btn onClick={onBack}>← {readOnly?'Volver':'Seguir editando'}</Btn>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>

    </div>

          <Mark h={40}/>
          <div>
            <div className="display" style={{fontSize:16,fontWeight:700,letterSpacing:'.09em'}}>{BRAND}</div>
            <div style={{fontSize:11.5,color:'var(--muted)'}}>{BIZ_PHONE} · {BIZ_EMAIL}</div>
          </div>
        </div>
        <div style={{textAlign:'right'}}>
          <div className="display num" style={{fontSize:18,fontWeight:700,color:'var(--accent)'}}>{q.quoteNum}</div>

        </div>
      </div>

      <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))',padding:'14px 0'}}>

        <div><div className="lbl">Contacto</div><div style={{fontSize:12.5}}>{q.email||'—'}{q.phone?' · '+q.phone:''}</div></div>

          {q.needBy&&<div style={{fontSize:11.5,color:'var(--muted)',marginTop:2}}>{q.needBy}</div>}</div>

          <tbody>{rows.map(it=>
            <tr key={it.id}>
              <td style={{fontWeight:600,whiteSpace:'nowrap'}}>{it.name}

                  <tbody>{it.roster.map(r=><tr key={r.id}>
                    <td className="num" style={{textAlign:'center'}}>{r.num||'—'}</td>
                    <td>{r.name||'—'}</td>
                    <td style={{textAlign:'center',textTransform:'uppercase'}}>{r.size}</td>
                  </tr>)}</tbody></table>
              </div>
            </div>)}

      </div>}

      {q.items.some(it=>it.notes)&&<div style={{paddingTop:14}}>
        <div className="lbl">Detalles de cada pieza</div>
        <div className="grid" style={{gap:7}}>
          {q.items.filter(it=>it.notes).map(it=>

        <div className="lbl">Diseños y logos</div>

          {imgs.map((im,i)=>im.src
            ?<figure key={i} style={{width:116}}>

          :<React.Fragment><strong style={{color:'var(--fg)'}}>Nota:</strong> Esta es una solicitud, no una factura. Al recibirla te enviamos la cotización con los costos finales.</React.Fragment>}
      </div>
    </Card>
    {children}
  </div>;
}

/* ══════════ ENVIAR COTIZACIÓN FINAL AL CLIENTE ══════════ */
function SendFinal({q,onSent}){
  const [msg,setMsg]=useState('');
  const [files,setFiles]=useState([]);
  const [state,setState]=useState('idle');
  const ref=useRef();
  const go=async()=>{
    setState('sending');
    try{
      const res=await post({action:'final',quoteId:q.id,email:q.email,message:msg,
        items:flatItems(q.items).map(it=>({id:it.id,price:Number(it.price)||0})),
        designs:files.map(f=>({label:f.label,src:f.src}))});
      if(res&&res.success){setState('sent');onSent&&onSent();}
      else setState('error');
    }catch(e){setState('error');}
  };
  return <Card>
    <h3 className="display" style={{fontSize:15,fontWeight:700,marginBottom:4}}>Enviar cotización al cliente</h3>
    <p style={{fontSize:12.5,color:'var(--muted)',marginBottom:13}}>
      Va a {q.email||'—'} con los precios de la tabla de arriba{q.sentAt?' · ya enviada una vez':''}.
    </p>

    <label className="lbl" htmlFor={'m'+q.id}>Mensaje</label>
    <textarea id={'m'+q.id} rows="3" value={msg} onChange={e=>setMsg(e.target.value)} style={{resize:'vertical',marginBottom:13}}
      placeholder="Ej: Adjunto el diseño que preparamos. El precio incluye bordado al frente. Tiempo de producción: 3 semanas desde la aprobación."/>

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:6}}>
      <div className="lbl" style={{margin:0}}>Diseño que preparamos{files.length?' · '+files.length:''}</div>
      <Btn cls="btn-accent" style={{padding:'4px 10px',fontSize:12}} onClick={()=>ref.current&&ref.current.click()}>+ Adjuntar</Btn>
    </div>
    <input ref={ref} type="file" accept="image/*" multiple hidden
      onChange={e=>{const fs=Array.from(e.target.files);let acc=files.slice();
        fs.forEach(f=>shrink(f,src=>{acc=acc.concat([{id:uid(),src,label:f.name.replace(/\.[^.]+$/,'')}]);setFiles(acc);}));e.target.value='';}}/>
    {files.length>0&&<div className="grid" style={{gridTemplateColumns:'repeat(auto-fill,minmax(118px,1fr))',marginBottom:13}}>
      {files.map(f=><div key={f.id} style={{position:'relative'}}>
        <img className="thumb" src={f.src} alt={f.label}/>
        <button className="x" onClick={()=>setFiles(files.filter(x=>x.id!==f.id))} aria-label="Quitar">×</button>
      </div>)}
    </div>}

    {state==='error'&&<div className="note" style={{background:'var(--danger-soft)',color:'var(--danger)',marginBottom:11}}>
      No se pudo enviar. Revisa la conexión y vuelve a intentarlo.</div>}
    {state==='sent'&&<div className="note" style={{background:'var(--ok-soft)',color:'var(--ok)',marginBottom:11}}>
      Enviada a {q.email}. Te llegó copia a {BIZ_EMAIL}.</div>}

    <Btn cls="btn-primary" disabled={state==='sending'||!q.email} onClick={go}>
      {state==='sending'?'Enviando…':state==='sent'?'Enviar de nuevo':'Enviar cotización'}
    </Btn>
  </Card>;
}

function Board({rows,setRows,loading,onRefresh,onOpen,offline}){

    const next=rows.map(r=>r.id===id?Object.assign({},r,{status:s}):r);
    setRows(next);lsSave(next);
    try{await post({action:'status',quoteId:id,status:s});}catch(e){}
  };
  const totals={};STATUSES.forEach(s=>{totals[s.key]=rows.filter(r=>r.status===s.key).reduce((t,r)=>t+grandOf(r.items),0);});
  const sum=ks=>ks.reduce((t,k)=>t+totals[k],0);

  return <div className="grid" style={{gap:12}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',gap:10,flexWrap:'wrap'}}>

        <h1 className="display" style={{fontSize:21,fontWeight:700}}>Cotizaciones</h1>

          {loading?'Cargando desde Google Sheets…':rows.length+(rows.length===1?' cotización registrada':' cotizaciones registradas')}</p>
      </div>

    {offline&&<div className="note" style={{background:'var(--warn-soft)',color:'var(--warn)',border:'1px solid currentColor'}}>
      No se pudo leer Google Sheets. Estás viendo el respaldo guardado en este navegador.
    </div>}

    <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(152px,1fr))',gap:8}}>
      {STATUSES.map(s=>{const n=rows.filter(r=>r.status===s.key).length;return(
        <div key={s.key} style={{background:s.bg,borderRadius:'var(--r)',padding:'11px 13px',borderLeft:'3px solid '+s.c}}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:'.05em',textTransform:'uppercase',color:s.c,marginBottom:5}}>{s.label}</div>
          <div className="num display" style={{fontSize:20,fontWeight:700,color:s.c,lineHeight:1}}>{n}</div>
          <div className="num" style={{fontSize:11.5,color:s.c,opacity:.85,marginTop:3}}>{fmt(totals[s.key])}</div>
        </div>);})}
    </div>

    {rows.length===0
      ?<Card style={{textAlign:'center',padding:'34px 22px'}}>
        <p style={{fontSize:14,marginBottom:6}}>Todavía no hay cotizaciones</p>
        <p style={{fontSize:12.5,color:'var(--muted)'}}>Las solicitudes que sometan los clientes aparecen aquí y llegan a {BIZ_EMAIL}.</p>
      </Card>
      :<div className="grid" style={{gap:8}}>
        {rows.map(r=>{const s=stat(r.status);return(
          <Card key={r.id} style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap',borderLeft:'3px solid '+s.c}}>
            <div style={{minWidth:148}}>
              <label className="lbl" htmlFor={'st'+r.id}>Estado</label>
              <select id={'st'+r.id} value={r.status} onChange={e=>setStatus(r.id,e.target.value)}
                style={{background:s.bg,color:s.c,fontWeight:600,fontSize:12,borderColor:'transparent'}}>
                {STATUSES.map(x=><option key={x.key} value={x.key}>{x.label}</option>)}
              </select>
            </div>
            <div style={{flex:'1 1 170px',minWidth:0}}>
              <div style={{fontWeight:600,fontSize:14.5}}>{r.client||'Sin cliente'}</div>
              <div style={{fontSize:11.5,color:'var(--muted)',overflowWrap:'anywhere'}}>{r.quoteNum} · {dShort(r.date)}{r.email?' · '+r.email:''}</div>
            </div>
            <div style={{minWidth:92}}>
              <div className="lbl">Entrega</div>
              <div className="num" style={{fontSize:12.5,fontWeight:600,color:'var(--accent)'}}>{dShort(r.deliveryDate)}</div>
            </div>
            <div style={{minWidth:58,textAlign:'right'}}>
              <div className="lbl">Piezas</div>
              <div className="num" style={{fontSize:13.5,fontWeight:600}}>{r.items.reduce((t,i)=>t+qtyOf(i),0)}</div>
            </div>
            <div style={{minWidth:88,textAlign:'right'}}>
              <div className="lbl">Total</div>
              <div className="num display" style={{fontSize:15,fontWeight:700,color:'var(--accent)'}}>{fmt(grandOf(r.items))}</div>
            </div>
            <Btn cls="btn-accent" style={{padding:'5px 12px',fontSize:12}} onClick={()=>onOpen(r)}>Ver →</Btn>
          </Card>);})}
      </div>}

    {rows.length>0&&<div style={{display:'flex',justifyContent:'flex-end'}}>
      <Card style={{minWidth:250}}>
        <div className="lbl">Resumen general</div>
        {[['Total cotizado',sum(['enviada','aceptada','deposito','entregado','saldo']),'var(--muted)'],
          ['Aceptado',sum(['aceptada','deposito','entregado','saldo']),'var(--violet)'],
          ['Cobrado',sum(['deposito','saldo']),'var(--ok)']].map(r=>

            <span className="num" style={{fontWeight:600,color:r[2]}}>{fmt(r[1])}</span></div>)}
      </Card>
    </div>}

      {(it.roster||[]).length>0&&<div style={{marginTop:11}}>
        <div className="lbl">Nombres y números · {it.roster.length}</div>
        <div className="tbl-scroll">
          <table><thead><tr><th style={{width:44}}>#</th><th style={{textAlign:'left'}}>Nombre</th><th style={{width:54}}>Talla</th></tr></thead>
            <tbody>{it.roster.map(r=><tr key={r.id}>
              <td className="num" style={{textAlign:'center'}}>{r.num||'—'}</td>
              <td>{r.name||'—'}</td>
              <td style={{textAlign:'center',textTransform:'uppercase'}}>{r.size}</td>
            </tr>)}</tbody></table>
        </div>
      </div>}
    </Card>)}
    <button className="drop" style={{padding:11,fontSize:12.5,cursor:'pointer',width:'100%'}}
      onClick={()=>setO(p=>Object.assign({},p,{items:p.items.concat([newOI()])}))}>+ Agregar artículo</button>
    <Card><Field label="Notas generales"><textarea rows="3" value={o.notes} onChange={e=>set('notes',e.target.value)} style={{resize:'vertical'}}/></Field></Card>
  </div>;
}

function OrderView({o,onBack,onExport}){
  return <div className="grid" style={{gap:12}}>
    <div className="no-print" style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
      <Btn onClick={onBack}>← Volver</Btn>
      <Btn cls="btn-ok" onClick={onExport}>Exportar Word</Btn>
    </div>
    <Card>
      <div style={{display:'flex',justifyContent:'space-between',gap:14,flexWrap:'wrap',paddingBottom:14,borderBottom:'1px solid var(--line)'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <Mark h={38}/>
          <div><div className="display" style={{fontSize:15,fontWeight:700,letterSpacing:'.09em'}}>{BRAND}</div>
            <div style={{fontSize:11.5,color:'var(--muted)'}}>Ficha técnica de producción</div></div>
        </div>
        <div style={{textAlign:'right'}}>
          <div className="display num" style={{fontSize:16,fontWeight:700}}>{o.orderNum}</div>
          <div style={{fontSize:13.5}}>{o.client||'—'}</div></div>
      </div>
      {o.items.map((it,idx)=><div key={it.id} style={{paddingTop:16,marginTop:idx?16:0,borderTop:idx?'1px solid var(--line)':'none'}}>
        <div style={{display:'flex',gap:18,flexWrap:'wrap'}}>
          <div className="grid" style={{gridTemplateColumns:'1fr 1fr',width:200,flexShrink:0,gap:8}}>
            {[['productImg','Producto'],['logo','Logo']].map(f=><div key={f[0]}>
              <div className="lbl">{f[1]}</div>
              {it[f[0]]?<img className="thumb" src={it[f[0]]} alt={f[1]}/>
                :<div className="drop thumb" style={{border:'1px solid var(--line)'}}>Sin imagen</div>}
            </div>)}
          </div>
          <div style={{flex:'1 1 220px',minWidth:0}}>
            <div style={{fontSize:15,fontWeight:600,marginBottom:9}}>{it.garment}{it.color?' — '+it.color:''}
              <span className="pill" style={{background:'var(--surface-2)',color:'var(--muted)',marginLeft:7}}>{it.fabric}</span></div>
            <div className="tbl-scroll" style={{marginBottom:9}}>
              <table><thead><tr>{SIZES.map(z=><th key={z}>{z}</th>)}<th>Total</th></tr></thead>
                <tbody><tr>{SIZES.map(z=><td key={z} className="num" style={{textAlign:'center',fontWeight:Number(it[z.toLowerCase()])>0?600:400,color:Number(it[z.toLowerCase()])>0?'inherit':'var(--muted)'}}>{Number(it[z.toLowerCase()])||'—'}</td>)}
                  <td className="num" style={{textAlign:'center',fontWeight:700,color:'var(--accent)'}}>{qtyOf(it)}</td></tr></tbody></table>
            </div>
            <div style={{display:'flex',gap:18,flexWrap:'wrap'}}>
              <div><div className="lbl">Ubicación</div><div style={{fontSize:12.5}}>{it.placement||'—'}</div></div>
              {it.placementSize&&<div><div className="lbl">Tamaño</div><div style={{fontSize:12.5}}>{it.placementSize}</div></div>}
            </div>
            {it.notes&&<div className="note" style={{background:'var(--surface-2)',marginTop:9}}>{it.notes}</div>}
            {(it.roster||[]).length>0&&<div style={{marginTop:9}}>
              <div className="lbl">Nombres y números · {it.roster.length}</div>
              <div className="tbl-scroll">
                <table><thead><tr><th style={{width:44}}>#</th><th style={{textAlign:'left'}}>Nombre</th><th style={{width:54}}>Talla</th></tr></thead>
                  <tbody>{it.roster.map(r=><tr key={r.id}>
                    <td className="num" style={{textAlign:'center'}}>{r.num||'—'}</td>
                    <td>{r.name||'—'}</td>
                    <td style={{textAlign:'center',textTransform:'uppercase'}}>{r.size}</td>
                  </tr>)}</tbody></table>
              </div>
            </div>}
          </div>
        </div>
      </div>)}
      <div style={{marginTop:16,paddingTop:12,borderTop:'1px solid var(--line)',display:'flex',justifyContent:'space-between',gap:10,flexWrap:'wrap',fontSize:11.5,color:'var(--muted)'}}>
        <span>{BRAND} · {BIZ_PHONE}</span>
        <span>Total de piezas: <strong className="num" style={{color:'var(--fg)'}}>{o.items.reduce((s,i)=>s+qtyOf(i),0)}</strong></span>
      </div>
    </Card>
  </div>;
}

/* ══════════ SHELL ══════════ */
function Shell({children,nav,sub}){
  return <React.Fragment>
    <header className="bar no-print">
      <div className="bar-in">
        <div style={{display:'flex',alignItems:'center',gap:9,minWidth:0}}>
          <Mark h={32}/>
          <div style={{minWidth:0}}>
            <div className="display" style={{fontWeight:700,fontSize:13.5,letterSpacing:'.09em'}}>{BRAND}</div>
            <div style={{fontSize:9.5,color:'var(--muted)',letterSpacing:'.08em',textTransform:'uppercase'}}>{sub}</div>
          </div>
        </div>
        <nav style={{display:'flex',gap:4,alignItems:'center',flexWrap:'wrap'}}>{nav}</nav>
      </div>
    </header>
    <main className="wrap">{children}</main>
  </React.Fragment>;
}

/* ══════════ APP ══════════ */
const blank=()=>({id:qid(),quoteNum:nextNum(),client:'',email:'',phone:'',date:today(),deliveryDate:'',needBy:'',notes:'',items:[newItem()],status:'enviada'});

function App(){
  const [mode,setMode]=useState('client');      // client | login | admin
  const [step,setStep]=useState('form');        // form | view | done
  const [tab,setTab]=useState('board');         // board | quote | orders
  const [sub,setSub]=useState(null);
  const [q,setQ]=useState(blank);
  const [send,setSend]=useState('idle');
  const [rows,setRows]=useState(lsLoad);
  const [loading,setLoading]=useState(false);
  const [offline,setOffline]=useState(false);
  const [open,setOpen]=useState(null);
  const [orders,setOrders]=useState([]);
  const [ord,setOrd]=useState(null);

  const setItem=(id,f,v)=>setQ(p=>Object.assign({},p,{items:p.items.map(i=>i.id===id?Object.assign({},i,{[f]:v}):i)}));
  const addItem=()=>setQ(p=>Object.assign({},p,{items:p.items.concat([newItem()])}));
  const delItem=id=>setQ(p=>Object.assign({},p,{items:p.items.filter(i=>i.id!==id)}));
  const reset=()=>{setQ(blank());setSend('idle');setStep('form');};

  const refresh=async()=>{
    setLoading(true);setOffline(false);
    try{
      const res=await getList();
      if(res&&res.success){
        if(Array.isArray(res.quotes)){setRows(res.quotes);lsSave(res.quotes);}
        if(Array.isArray(res.orders))setOrders(res.orders);
      }
      else throw new Error('sin datos');
    }catch(e){setOffline(true);setRows(lsLoad());}
    setLoading(false);
  };
  useEffect(()=>{if(mode==='admin')refresh();},[mode]);

  const saveOrder=async()=>{
    if(!ord)return;
    setOrders(p=>{const i=p.findIndex(x=>x.id===ord.id);if(i>=0){const n=p.slice();n[i]=ord;return n;}return[ord].concat(p);});
    setSub(null);setOrd(null);
    try{await post({action:'orderSave',order:ord});}catch(e){}
    refresh();
  };
  const delOrder=async(id)=>{
    setOrders(p=>p.filter(x=>x.id!==id));
    try{await post({action:'orderDelete',orderId:id});}catch(e){}
  };
  const setOrderStatus=async(id,s)=>{
    setOrders(p=>p.map(x=>x.id===id?Object.assign({},x,{status:s}):x));
    try{await post({action:'orderStatus',orderId:id,status:s});}catch(e){}
  };
  const makeOrder=q=>{setOrd(orderFromQuote(q));setOpen(null);setTab('orders');setSub('edit');};

  const submit=async()=>{
    if(!q.client.trim()||!q.email.trim()){setStep('form');setTimeout(()=>{const el=document.getElementById(q.client.trim()?'f-email':'f-client');if(el)el.focus();},60);return;}
    setSend('sending');
    const entry=Object.assign({},q,{submittedAt:new Date().toISOString(),status:'enviada'});
    const local=lsLoad().concat([entry]);lsSave(local);setRows(local);
    try{
      const wire=Object.assign({},entry,{items:flatItems(entry.items).map(it=>Object.assign({},it,{
        name:it.model?it.name+' ('+it.model+')':it.name}))});
      const res=await post({action:'create',quote:wire});
      if(res&&res.success){
        if(res.quoteNum)setQ(p=>Object.assign({},p,{quoteNum:res.quoteNum}));
        setSend('sent');setTimeout(()=>setStep('done'),450);
      }
      else setSend('error');
    }catch(e){setSend('error');}
  };

  if(mode==='login')return <Shell sub="Acceso interno" nav={null}><Login onOk={()=>setMode('admin')} onCancel={()=>setMode('client')}/></Shell>;

  if(mode==='client')return <Shell sub="Solicitud de cotización"
    nav={<Btn style={{color:'var(--muted)',fontSize:12,padding:'5px 11px'}} onClick={()=>setMode('login')}>Acceso interno</Btn>}>
    {step==='form'&&<QuoteForm q={q} setQ={setQ} setItem={setItem} addItem={addItem} delItem={delItem}
      onPreview={()=>setStep('view')} onExport={()=>quoteDoc(q,false)} admin={false}/>}
    {step==='view'&&<QuoteView q={q} onBack={()=>setStep('form')} onExport={()=>quoteDoc(q,false)} onSubmit={submit} state={send}/>}
    {step==='done'&&<Done num={q.quoteNum} onNew={reset}/>}
  </Shell>;

  const tabs=[['board','Cotizaciones'],['quote','Nueva cotización'],['orders','Logística']];
  return <Shell sub="Panel interno" nav={<React.Fragment>
      {tabs.map(t=><button key={t[0]} className="tab" aria-selected={tab===t[0]}
        onClick={()=>{setTab(t[0]);setSub(null);setOpen(null);}}>
        {t[1]}
        {t[0]==='board'&&rows.length>0&&<span className="pill num" style={{background:'var(--accent)',color:'var(--surface)',marginLeft:5}}>{rows.length}</span>}
      </button>)}
      <Btn style={{color:'var(--muted)',fontSize:12,padding:'5px 11px',marginLeft:4}} onClick={()=>{setMode('client');setTab('board');}}>Salir</Btn>
    </React.Fragment>}>

    {tab==='board'&&!open&&<Board rows={rows} setRows={setRows} loading={loading} onRefresh={refresh} onOpen={setOpen} offline={offline}/>}
    {tab==='board'&&open&&<QuoteView q={open} readOnly prices onBack={()=>setOpen(null)}
      onExport={()=>quoteDoc(open,true)} state="sent"
      onPrice={(id,v)=>setOpen(o=>Object.assign({},o,{items:o.items.map(it=>it.id===id?Object.assign({},it,{price:v}):it)}))}>
      <SendFinal q={open} onSent={refresh}/>
      <Card style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}}>
        <div>
          <div style={{fontWeight:600,fontSize:14}}>¿Ya aceptó el cliente?</div>
          <div style={{fontSize:12.5,color:'var(--muted)',marginTop:2}}>Pasa tallas, telas, colores y jugadores a una ficha de fábrica.</div>
        </div>
        <Btn cls="btn-primary" onClick={()=>makeOrder(open)}>Crear orden de producción</Btn>
      </Card>
    </QuoteView>}

    {tab==='quote'&&step!=='view'&&<QuoteForm q={q} setQ={setQ} setItem={setItem} addItem={addItem} delItem={delItem}
      onPreview={()=>setStep('view')} onExport={()=>quoteDoc(q,true)} admin/>}
    {tab==='quote'&&step==='view'&&<QuoteView q={q} prices onBack={()=>setStep('form')} onExport={()=>quoteDoc(q,true)} onSubmit={submit} state={send}/>}

    {tab==='orders'&&!sub&&<Orders orders={orders} loading={loading}
      onNew={()=>{setOrd(newOrd());setSub('edit');}}
      onEdit={o=>{setOrd(JSON.parse(JSON.stringify(o)));setSub('edit');}}
      onDel={delOrder} onStatus={setOrderStatus}
      onOpen={o=>{setOrd(o);setSub('view');}}/>}
    {tab==='orders'&&sub==='edit'&&ord&&<OrderForm o={ord} setO={setOrd}
      onSave={saveOrder} onCancel={()=>{setSub(null);setOrd(null);}}/>}
    {tab==='orders'&&sub==='view'&&ord&&<OrderView o={ord} onBack={()=>setSub(null)} onExport={()=>orderDoc(ord)}/>}
  </Shell>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
